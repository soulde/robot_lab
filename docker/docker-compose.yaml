name: robot-lab-training

services:
  trainer:
    image: ${ROBOT_LAB_IMAGE:-robot-lab:isaac-lab-3.0.0-rc1}
    container_name: robot-lab-training
    init: true
    entrypoint: []
    working_dir: /workspace/robot_lab
    user: "${HOST_UID:?launcher must set HOST_UID}:${HOST_GID:?launcher must set HOST_GID}"
    gpus: all
    shm_size: 8gb
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Set ACCEPT_EULA=Y before smoke or train}
      OMNI_KIT_ACCEPT_EULA: "YES"
      RLL_MOTION_DATA_DIR: /workspace/motion-data
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      PYTHONUNBUFFERED: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
      USER: "${HOST_UID}"
      LOGNAME: "${HOST_UID}"
    volumes:
      - type: bind
        source: ${MOTION_DATA_HOST:?launcher must set MOTION_DATA_HOST}
        target: /workspace/motion-data
        read_only: true
      - type: bind
        source: ${OUTPUT_DIR_HOST:?launcher must set OUTPUT_DIR_HOST}
        target: /workspace/robot_lab/logs
